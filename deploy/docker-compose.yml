version: '3.8'

services:
  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: delta_algo_trader
    restart: always
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - trader_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  trader_data:
